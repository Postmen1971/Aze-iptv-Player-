name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SkorText-Videotext aktuell übernehmen
        run: |
          # Neueste SkorText-Seiten aus dem SkorText-Repository holen; klappt das nicht, bleibt die gespeicherte Kopie.
          if git clone --depth 1 https://github.com/Postmen1971/SkorText "$RUNNER_TEMP/skortext"; then
            cp -r "$RUNNER_TEMP/skortext/app/src/main/assets/www/." app/src/main/assets/skortext/
            echo "SkorText-Stand: $(git -C "$RUNNER_TEMP/skortext" log -1 --format=%h)"
          else
            echo "::warning::SkorText konnte nicht geladen werden – gespeicherte Kopie wird verwendet."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Signaturschlüssel vorbereiten
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "password=$KEYSTORE_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "label=" >> "$GITHUB_OUTPUT"
          else
            # Noch keine Secrets: mit dem öffentlichen Test-Schlüssel signieren (siehe keystore/README.md)
            echo "file=$GITHUB_WORKSPACE/keystore/test.jks" >> "$GITHUB_OUTPUT"
            echo "password=aze-test-key" >> "$GITHUB_OUTPUT"
            echo "label= (Testversion)" >> "$GITHUB_OUTPUT"
            echo "::warning::Keine Secrets hinterlegt – Testversion mit öffentlichem Test-Schlüssel."
          fi

      - name: APK bauen
        env:
          KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          KEYSTORE_PASSWORD: ${{ steps.key.outputs.password }}
        run: |
          gradle :app:assembleRelease --stacktrace
          mkdir -p out
          # Eine APK je Prozessor-Typ plus "universal" (läuft überall, ist aber größer).
          # Feste Namen, damit der Download-Link immer gleich bleibt.
          for f in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$f" | sed -e 's/^app-//' -e 's/-release.apk$//')
            cp "$f" "out/Aze-IPTV-Player-${abi}.apk"
          done
          ls -la out

      - name: APK als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: Aze-IPTV-Player-1.0.${{ github.run_number }}
          path: out/*.apk

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Aze-IPTV-Player 1.0.${{ github.run_number }}${{ steps.key.outputs.label }}
          body: ${{ github.event.head_commit.message }}
          files: out/*.apk
