name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_test:
        description: "Emulator-Test überspringen (nur auf ausdrücklichen Wunsch)"
        type: boolean
        default: false
      guide_only:
        description: "Nur die Anleitung (Fotos) neu machen, keine Videos"
        type: boolean
        default: false
      record_help:
        description: "Erklär-Videos neu aufnehmen (Release „hilfe“)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.key.outputs.label }}
    steps:
      - uses: actions/checkout@v4

      - name: SkorText-Videotext aktuell übernehmen
        run: |
          # Neueste SkorText-Seiten aus dem SkorText-Repository holen; klappt das nicht, bleibt die gespeicherte Kopie.
          if git clone --depth 1 https://github.com/Postmen1971/SkorText "$RUNNER_TEMP/skortext"; then
            cp -r "$RUNNER_TEMP/skortext/app/src/main/assets/www/." app/src/main/assets/skortext/
            echo "SkorText-Stand: $(git -C "$RUNNER_TEMP/skortext" log -1 --format=%h)"
          else
            echo "::warning::SkorText konnte nicht geladen werden – gespeicherte Kopie wird verwendet."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Signaturschlüssel vorbereiten
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "password=$KEYSTORE_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "label=" >> "$GITHUB_OUTPUT"
          else
            # Noch keine Secrets: mit dem öffentlichen Test-Schlüssel signieren (siehe keystore/README.md)
            echo "file=$GITHUB_WORKSPACE/keystore/test.jks" >> "$GITHUB_OUTPUT"
            echo "password=aze-test-key" >> "$GITHUB_OUTPUT"
            echo "label= (Testversion)" >> "$GITHUB_OUTPUT"
            echo "::warning::Keine Secrets hinterlegt – Testversion mit öffentlichem Test-Schlüssel."
          fi

      - name: APK bauen
        env:
          KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          KEYSTORE_PASSWORD: ${{ steps.key.outputs.password }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: |
          set -o pipefail
          # Compiler-Fehler zusätzlich als Hinweise am Lauf anzeigen (Logs sind nicht immer abrufbar)
          gradle :app:testReleaseUnitTest :app:assembleRelease :app:assembleQa --stacktrace 2>&1 | tee build.log || {
            # fehlgeschlagene Tests als Hinweise anzeigen
            for f in app/build/test-results/testReleaseUnitTest/*.xml; do
              [ -f "$f" ] && grep -o 'testcase name="[^"]*"[^>]*>\s*<failure message="[^"]*"' "$f" | head -20 | while IFS= read -r l; do echo "::error::Test: $l"; done
            done
            grep -E "^e: |What went wrong" -A2 build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
          mkdir -p out
          # Eine APK je Prozessor-Typ plus "universal" (läuft überall, ist aber größer).
          # Feste Namen, damit der Download-Link immer gleich bleibt.
          for f in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$f" | sed -e 's/^app-//' -e 's/-release.apk$//')
            cp "$f" "out/Aze-IPTV-Player-${abi}.apk"
          done
          ls -la out
          # Test-Build für den Emulator (wird nicht veröffentlicht)
          mkdir -p qa
          cp app/build/outputs/apk/qa/app-x86_64-qa.apk qa/aze-qa-x86_64.apk

      - name: APK als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: Aze-IPTV-Player-1.0.${{ github.run_number }}
          path: out/*.apk

      - name: Test-Build ablegen
        uses: actions/upload-artifact@v4
        with:
          name: qa-apk
          path: qa/aze-qa-x86_64.apk
          retention-days: 3

  # Automatischer Test: App im Android-Emulator starten und Hänger simulieren.
  # Nur wenn alles besteht, wird die neue Version veröffentlicht.
  emulator-test:
    needs: build
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_test) }}
    # feste Ubuntu-Version: auf dem neuen Abbild hing die ffmpeg-Installation (Lauf brach nach 40 min ab)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: KVM freischalten (schneller Emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/download-artifact@v4
        with:
          name: qa-apk
          path: qa

      # Test-Videos nur einmal erzeugen und dann aus dem Zwischenspeicher nehmen (ffmpeg-Installation hing öfter)
      - name: Test-Videos aus dem Zwischenspeicher
        id: media
        uses: actions/cache@v4
        with:
          path: .github/qa/media
          key: qa-media-${{ hashFiles('.github/qa/make_media.sh') }}

      - name: Test-Sender erzeugen und Test-Server starten
        timeout-minutes: 12
        run: |
          if [ "${{ steps.media.outputs.cache-hit }}" != "true" ]; then
            # ffmpeg: erst Paketquelle (max. 4 min), sonst fertiges Programm herunterladen
            command -v ffmpeg >/dev/null || timeout 240 bash -c 'sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg' || echo "apt fehlgeschlagen"
            if ! command -v ffmpeg >/dev/null; then
              curl -sSfL --retry 3 -o /tmp/ff.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
              mkdir -p /tmp/ff && tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
              sudo cp /tmp/ff/ffmpeg /usr/local/bin/ffmpeg
            fi
            bash .github/qa/make_media.sh
          else
            echo "Test-Videos aus dem Zwischenspeicher"; ls -la .github/qa/media
          fi
          nohup python3 .github/qa/test_server.py 8090 > qa-server.log 2>&1 &
          sleep 2
          curl -sf http://127.0.0.1:8090/list.m3u | head -3

      - name: Emulator-Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/qa/run_emulator_test.sh qa/aze-qa-x86_64.apk qa-out

      - name: Test-Bilder in Release „qa-bilder“ (zum Ansehen ohne Anmeldung)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d qa-out ] || exit 0
          (cd qa-out && zip -qr ../qa-bilder.zip . -i '*.png' '*.txt')
          gh release view qa-bilder >/dev/null 2>&1 || gh release create qa-bilder --title "Test-Bilder" --notes "Bilder und Protokoll vom letzten Emulator-Test" --prerelease
          gh release upload qa-bilder qa-bilder.zip --clobber
      - name: Test-Ergebnis ablegen (Bilder, Protokoll)
        if: always()
        run: cp qa-server.log qa-out/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test-ergebnis
          path: qa-out/
          retention-days: 14

  release:
    needs: [build, emulator-test]
    # nur Videos neu (record_help + skip_test): keine neue App-Version veröffentlichen
    if: ${{ always() && needs.build.result == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.record_help && inputs.skip_test) && (needs.emulator-test.result == 'success' || (needs.emulator-test.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.skip_test)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Aze-IPTV-Player-1.0.${{ github.run_number }}
          path: out

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Aze-IPTV-Player 1.0.${{ github.run_number }}${{ needs.build.outputs.label }}
          body: ${{ github.event.head_commit.message }}
          files: out/*.apk

  # Erklär-Videos: der Emulator bedient die echte App und filmt sie; Ergebnis kommt in den Release „hilfe“
  help-videos:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.record_help }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: KVM freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: qa-apk
          path: qa
      - name: Test-Videos aus dem Zwischenspeicher
        id: media
        uses: actions/cache@v4
        with:
          path: .github/qa/media
          key: qa-media-${{ hashFiles('.github/qa/make_media.sh') }}
      - name: ffmpeg und Test-Server
        timeout-minutes: 12
        run: |
          # ffmpeg MIT Texteinblendung (drawtext) – das fertige Programm hat sie immer
          if ! ffmpeg -hide_banner -filters 2>/dev/null | grep -q drawtext; then
            curl -sSfL --retry 3 -o /tmp/ff.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            mkdir -p /tmp/ff && tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
            sudo cp /tmp/ff/ffmpeg /usr/local/bin/ffmpeg
          fi
          [ "${{ steps.media.outputs.cache-hit }}" = "true" ] || bash .github/qa/make_media.sh
          nohup python3 .github/qa/test_server.py 8090 > qa-server.log 2>&1 &
          sleep 2; curl -sf http://127.0.0.1:8090/demo.m3u | head -3
      - name: Videos aufnehmen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          ram-size: 2048M
          disable-animations: true
          # Bildschirm wie ein Fernseher (quer, 1920×1080)
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -skin 1920x1080
          script: if [ "${{ inputs.guide_only }}" != "true" ]; then bash .github/qa/record_help.sh qa/aze-qa-x86_64.apk; fi; bash .github/qa/make_guide.sh qa/aze-qa-x86_64.apk
      - name: In Release „hilfe“ hochladen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view hilfe >/dev/null 2>&1 || gh release create hilfe --title "Erklär-Videos" --notes "Erklär-Videos für die Hilfe in der App (werden automatisch aufgenommen)." --prerelease
          if ls help-out/*.mp4 >/dev/null 2>&1; then gh release upload hilfe help-out/*.mp4 --clobber; fi
      - name: Anleitung (Webseite) bauen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/qa/build_guide.py guide && ls guide/img | wc -l
          (cd guide && zip -qr ../anleitung.zip .) && gh release upload hilfe anleitung.zip --clobber
      - uses: actions/upload-pages-artifact@v3
        with:
          path: guide
  guide-page:
    needs: help-videos
    runs-on: ubuntu-24.04
    # einmalig nötig: GitHub → Settings → Pages → Source: „GitHub Actions“
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
