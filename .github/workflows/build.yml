name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Signaturschlüssel vorbereiten
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Kein Signaturschlüssel hinterlegt – es wird nur eine Test-APK gebaut, kein Release."
          fi

      - name: APK bauen
        env:
          KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_FILE" ]; then unset KEYSTORE_FILE; fi
          gradle :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "Aze-IPTV-Player-1.0.${GITHUB_RUN_NUMBER}.apk"

      - name: Test-APK ablegen
        uses: actions/upload-artifact@v4
        with:
          name: Aze-IPTV-Player-1.0.${{ github.run_number }}
          path: Aze-IPTV-Player-*.apk

      - name: Release veröffentlichen
        if: steps.key.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Aze-IPTV-Player 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: Aze-IPTV-Player-*.apk
