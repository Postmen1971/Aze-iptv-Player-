name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.key.outputs.label }}
    steps:
      - uses: actions/checkout@v4

      - name: SkorText-Videotext aktuell übernehmen
        run: |
          # Neueste SkorText-Seiten aus dem SkorText-Repository holen; klappt das nicht, bleibt die gespeicherte Kopie.
          if git clone --depth 1 https://github.com/Postmen1971/SkorText "$RUNNER_TEMP/skortext"; then
            cp -r "$RUNNER_TEMP/skortext/app/src/main/assets/www/." app/src/main/assets/skortext/
            echo "SkorText-Stand: $(git -C "$RUNNER_TEMP/skortext" log -1 --format=%h)"
          else
            echo "::warning::SkorText konnte nicht geladen werden – gespeicherte Kopie wird verwendet."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Signaturschlüssel vorbereiten
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "password=$KEYSTORE_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "label=" >> "$GITHUB_OUTPUT"
          else
            # Noch keine Secrets: mit dem öffentlichen Test-Schlüssel signieren (siehe keystore/README.md)
            echo "file=$GITHUB_WORKSPACE/keystore/test.jks" >> "$GITHUB_OUTPUT"
            echo "password=aze-test-key" >> "$GITHUB_OUTPUT"
            echo "label= (Testversion)" >> "$GITHUB_OUTPUT"
            echo "::warning::Keine Secrets hinterlegt – Testversion mit öffentlichem Test-Schlüssel."
          fi

      - name: APK bauen
        env:
          KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          KEYSTORE_PASSWORD: ${{ steps.key.outputs.password }}
        run: |
          set -o pipefail
          # Compiler-Fehler zusätzlich als Hinweise am Lauf anzeigen (Logs sind nicht immer abrufbar)
          gradle :app:testReleaseUnitTest :app:assembleRelease :app:assembleQa --stacktrace 2>&1 | tee build.log || {
            # fehlgeschlagene Tests als Hinweise anzeigen
            for f in app/build/test-results/testReleaseUnitTest/*.xml; do
              [ -f "$f" ] && grep -o 'testcase name="[^"]*"[^>]*>\s*<failure message="[^"]*"' "$f" | head -20 | while IFS= read -r l; do echo "::error::Test: $l"; done
            done
            grep -E "^e: |What went wrong" -A2 build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
          mkdir -p out
          # Eine APK je Prozessor-Typ plus "universal" (läuft überall, ist aber größer).
          # Feste Namen, damit der Download-Link immer gleich bleibt.
          for f in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$f" | sed -e 's/^app-//' -e 's/-release.apk$//')
            cp "$f" "out/Aze-IPTV-Player-${abi}.apk"
          done
          ls -la out
          # Test-Build für den Emulator (wird nicht veröffentlicht)
          mkdir -p qa
          cp app/build/outputs/apk/qa/app-x86_64-qa.apk qa/aze-qa-x86_64.apk

      - name: APK als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: Aze-IPTV-Player-1.0.${{ github.run_number }}
          path: out/*.apk

      - name: Test-Build ablegen
        uses: actions/upload-artifact@v4
        with:
          name: qa-apk
          path: qa/aze-qa-x86_64.apk
          retention-days: 3

  # Automatischer Test: App im Android-Emulator starten und Hänger simulieren.
  # Nur wenn alles besteht, wird die neue Version veröffentlicht.
  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: KVM freischalten (schneller Emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/download-artifact@v4
        with:
          name: qa-apk
          path: qa

      - name: Test-Sender erzeugen und Test-Server starten
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          bash .github/qa/make_media.sh
          nohup python3 .github/qa/test_server.py 8090 > qa-server.log 2>&1 &
          sleep 2
          curl -sf http://127.0.0.1:8090/list.m3u | head -3

      - name: Emulator-Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/qa/run_emulator_test.sh qa/aze-qa-x86_64.apk qa-out

      - name: Test-Ergebnis ablegen (Bilder, Protokoll)
        if: always()
        run: cp qa-server.log qa-out/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test-ergebnis
          path: qa-out/
          retention-days: 14

  release:
    needs: [build, emulator-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Aze-IPTV-Player-1.0.${{ github.run_number }}
          path: out

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Aze-IPTV-Player 1.0.${{ github.run_number }}${{ needs.build.outputs.label }}
          body: ${{ github.event.head_commit.message }}
          files: out/*.apk
