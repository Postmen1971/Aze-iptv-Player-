name: Langzeit-Test (echte freie Sender)

# Ergänzt den Emulator-Test im Build: echte, frei empfangbare Sender aus der öffentlichen iptv-org-Liste,
# lange Laufzeiten und viel Zappen. Blockiert keine Veröffentlichung (eigener Ablauf).
on:
  schedule:
    - cron: "41 1 * * *"   # jede Nacht (ca. 2:41 Uhr deutscher Zeit)
  workflow_dispatch:
    inputs:
      faktor:
        description: "Dauer-Faktor (1 = ca. 85 min, 2 = ca. 2,5 h)"
        default: "1"
      sender_de:
        description: "Anzahl deutsche Sender"
        default: "8"
      sender_tr:
        description: "Anzahl türkische Sender"
        default: "6"
  # läuft auch, wenn der Langzeit-Test selbst geändert wird
  push:
    branches: [main]
    paths:
      - ".github/workflows/langzeit.yml"
      - ".github/qa/run_langzeit_test.sh"
      - ".github/qa/langzeit_liste.py"
      - ".github/qa/langzeit_bericht.py"

permissions:
  contents: write

concurrency:
  group: langzeit
  cancel-in-progress: false

jobs:
  langzeit:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Test-App bauen (aktueller Stand)
        run: |
          set -o pipefail
          TAG=$(curl -sS https://api.github.com/repos/${{ github.repository }}/releases/latest | python3 -c "import sys,json; print(json.load(sys.stdin).get('tag_name',''))" || true)
          echo "LZ_LABEL=Code-Stand ${GITHUB_SHA::7} (zuletzt veröffentlicht: ${TAG:-?}), $(date -u +%d.%m.%Y)" >> "$GITHUB_ENV"
          # Versionsnummer wie die zuletzt veröffentlichte App (sonst hielte sich die Test-App für uralt)
          NUM="${TAG##*.}"; case "$NUM" in ''|*[!0-9]*) NUM=1 ;; esac
          GITHUB_RUN_NUMBER="$NUM" gradle :app:assembleQa --stacktrace 2>&1 | tee build.log || {
            grep -E "^e: |What went wrong" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
          cp app/build/outputs/apk/qa/app-x86_64-qa.apk aze-qa.apk

      - name: KVM freischalten (schneller Emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Freie Sender suchen und prüfen (iptv-org)
        run: |
          python3 .github/qa/langzeit_liste.py langzeit-list "${{ inputs.sender_de || '8' }}" "${{ inputs.sender_tr || '6' }}"
          echo "LZ_N=$(grep -c '^#EXTINF' langzeit-list/list.m3u)" >> "$GITHUB_ENV"
          nohup python3 -m http.server 8091 --directory langzeit-list > lz-server.log 2>&1 &
          sleep 2
          curl -sf http://127.0.0.1:8091/list.m3u | head -5

      - name: Langzeit-Test im Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/qa/run_langzeit_test.sh aze-qa.apk langzeit-out "${{ inputs.faktor || '1' }}" "${{ env.LZ_N }}"

      - name: Bericht
        if: always()
        run: |
          [ -d langzeit-out ] || exit 0
          python3 .github/qa/langzeit_bericht.py langzeit-out langzeit-list/sender.txt "$LZ_LABEL"

      # Bericht und Protokoll zum Ansehen ohne Anmeldung (nur Text – keine Bilder von Sendungen)
      - name: Bericht in Release „langzeit“
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f langzeit-out/bericht.txt ] || exit 0
          cp langzeit-out/bericht.txt langzeit-bericht.txt
          cp langzeit-list/list.m3u langzeit-out/ 2>/dev/null || true
          (cd langzeit-out && zip -q ../langzeit-protokoll.zip ./*)
          gh release view langzeit >/dev/null 2>&1 || gh release create langzeit --title "Langzeit-Test" --notes "Ergebnis des letzten Langzeit-Tests mit echten freien Sendern (iptv-org). Nur Text-Protokolle." --prerelease
          gh release upload langzeit langzeit-bericht.txt langzeit-protokoll.zip --clobber

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: langzeit-ergebnis
          path: |
            langzeit-out/
            langzeit-list/
          retention-days: 30
