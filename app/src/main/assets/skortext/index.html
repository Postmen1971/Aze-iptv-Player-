<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SkorText</title>
<style>
@font-face{font-family:"SkorMono";src:url("fonts/DejaVuSansMono-Bold.ttf") format("truetype")}
@font-face{font-family:"SkorSans";src:url("fonts/DejaVuSansCondensed-Bold.ttf") format("truetype")}
html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:none;text-size-adjust:none}
#scr{position:absolute;overflow:hidden}
.row{position:absolute;left:0;right:0;overflow:hidden}
.sg{pointer-events:none;position:absolute;top:0;white-space:nowrap;overflow:hidden;display:flex;align-items:center;height:100%}
.sg.r{justify-content:flex-end}.sg.c{justify-content:center}
#rate{position:absolute;display:flex;align-items:center;justify-content:space-between;white-space:nowrap;pointer-events:none}
#rate b{color:#ffee33}#rate span{color:#8a8a8a}
</style>
</head>
<body>
<div id="scr"></div>
<div id="rate"><b></b><span></span></div>
<script src="app.js"></script>
</body>
</html>
